name: Pages

on:
  push:
    branches: [ version-4-webb-MVC ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Update Maven Wrapper if outdated
      - name: Update Maven Wrapper (only if needed)
        run: |
          echo "Checking for Maven Wrapper updates..."
          LATEST=$(curl -s https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/maven-metadata.xml \
            | grep -oPm1 "(?<=<release>)[^<]+")
          echo "Latest Maven version: $LATEST"

          CURRENT=$(grep -oPm1 "(?<=apache-maven/)[^/]+" .mvn/wrapper/maven-wrapper.properties || echo "none")
          echo "Current Maven version: $CURRENT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "Updating Maven Wrapper to $LATEST..."
            mvn -N wrapper:wrapper -Dmaven=$LATEST

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add .mvn/wrapper/maven-wrapper.* mvnw mvnw.cmd || true
            git commit -m "chore: update Maven Wrapper to $LATEST" || echo "No changes to commit"
            git push || echo "Push skipped (no permission or no changes)"
          else
            echo "Wrapper already up to date. Skipping update."
          fi

      - name: Build docs
        run: |
          ./mvnw -B verify
          mkdir -p docs/javadoc docs/jacoco-tests
          cp -r target/reports/apidocs/* docs/javadoc/ 2>/dev/null || true
          cp -r target/site/jacoco/*    docs/jacoco-tests/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        uses: actions/deploy-pages@v4
