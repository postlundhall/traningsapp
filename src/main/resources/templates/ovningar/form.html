<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::main})}">
<main>
    <div class="container">
        <h1 class="mb-4 display-5 fw-bold" th:text="${ovning.id} ? #{ovning.form.title.edit} : #{ovning.form.title.new}">Redigera övning</h1>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        <div class="card">
            <div class="card-body">
                <form th:action="${ovning.id} ? @{/ovningar/{id}(id=${ovning.id})} : @{/ovningar}"
                      th:object="${ovning}" method="post">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" name="version" th:value="${ovning.version != null ? ovning.version : 0}" th:if="${ovning.id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label for="ovningsnamn" class="form-label" th:text="#{ovning.form.name}">Namn</label>
                        <input type="text"
                               th:class="${#fields.hasErrors('ovningsnamn')} ? 'form-control is-invalid' : 'form-control'"
                               id="ovningsnamn"
                               th:field="*{ovningsnamn}"
                               maxlength="255"
                               th:attr="aria-invalid=${#fields.hasErrors('ovningsnamn')} ? 'true' : 'false',
                               aria-describedby='ovningsnamnError'"
                               aria-required="true"/>
                        <div th:if="${#fields.hasErrors('ovningsnamn')}" th:errors="*{ovningsnamn}" class="invalid-feedback d-block"></div>
                    </div>
                    <div class="mb-3">
                        <label for="utrustning" class="form-label" th:text="#{ovning.form.equipment}">Utrustning</label>
                        <select th:class="${#fields.hasErrors('utrustning')} ? 'form-select is-invalid' : 'form-select'"
                                id="utrustning"
                                th:field="*{utrustning}"
                                aria-required="true"
                                th:attr="aria-invalid=${#fields.hasErrors('utrustning')} ? 'true' : 'false',
                                aria-describedby='utrustningError'">
                            <option th:each="utrustning : ${T(com.postlundhall.TraningsregisterSpringH2.model.Ovning$Utrustning).values()}"
                                    th:value="${utrustning}"
                                    th:text="${#messages.msgOrNull('ovning.utrustning.' + utrustning)}"></option>
                        </select>
                        <div id="utrustningError" th:if="${#fields.hasErrors('utrustning')}" th:errors="*{utrustning}" class="invalid-feedback d-block"></div>
                    </div>
                    <div class="mb-3">
                        <label for="primarMuskel" class="form-label" th:text="#{ovning.form.muscle}">Primär muskel</label>
                        <select th:class="${#fields.hasErrors('primarMuskel')} ? 'form-select is-invalid' : 'form-select'"
                                id="primarMuskel"
                                th:field="*{primarMuskel}"
                                aria-required="true"
                                th:attr="aria-invalid=${#fields.hasErrors('primarMuskel')} ? 'true' : 'false',
                                aria-describedby='primarMuskelError'">
                            <option th:each="muskel : ${T(com.postlundhall.TraningsregisterSpringH2.model.Ovning$PrimarMuskel).values()}"
                                    th:value="${muskel}"
                                    th:text="${#messages.msgOrNull('ovning.primarMuskel.' + muskel)}"></option>
                        </select>
                        <div id="primarMuskelError" th:if="${#fields.hasErrors('primarMuskel')}" th:errors="*{primarMuskel}" class="invalid-feedback d-block"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/ovningar}" class="btn btn-secondary" role="button" th:attr="aria-label=#{ovning.form.cancel},data-bs-toggle='tooltip',data-bs-title=#{ovning.form.cancel}" th:text="#{ovning.form.cancel}">Avbryt</a>
                        <button type="submit" class="btn btn-primary" role="button" th:attr="aria-label=#{ovning.form.save},data-bs-toggle='tooltip',data-bs-title=#{ovning.form.save}" th:text="#{ovning.form.save}">Spara</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</html>
