<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::main})}">
<main>
    <section class="container">
        <h1 class="mb-4 display-5 fw-bold" th:text="#{ovning.list.title}">Övningar</h1>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" aria-live="polite">
            <span th:text="#{${errorMessage}}">Felmeddelande</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{general.close}"></button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" aria-live="polite">
            <span th:text="#{${successMessage}}">Lyckades</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{general.close}"></button>
        </div>

        <nav aria-label="Övningsåtgärder" class="mb-3">
            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/ovningar/new}" class="btn btn-primary"
                   th:attr="aria-label=#{ovning.form.title.new},data-bs-toggle='tooltip',data-bs-title=#{ovning.form.title.new}"
                   th:text="#{ovning.form.title.new}">Ny övning</a>
            </div>
        </nav>

        <!-- Filter Form -->
        <div class="mb-4">
            <form th:action="@{/ovningar}" method="get" class="row g-3">
                <div class="col-md-4">
                    <label for="search" class="form-label" th:text="#{ovning.form.name}">Namn</label>
                    <input type="text" id="search" name="search" class="form-control" th:value="${search}"/>
                </div>
                <div class="col-md-3">
                    <label for="equipment" class="form-label" th:text="#{ovning.form.equipment}">Utrustning</label>
                    <select id="equipment" name="equipment" class="form-select">
                        <option value="" th:selected="${equipment == null or equipment == ''}" th:text="#{general.all}">Alla</option>
                        <option th:each="utr : ${T(com.postlundhall.TraningsregisterSpringH2.model.Ovning$Utrustning).values()}"
                                th:value="${utr.name()}" th:text="${#messages.msgOrNull('ovning.utrustning.' + utr)}"
                                th:selected="${equipment == utr.name()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="muscle" class="form-label" th:text="#{ovning.form.muscle}">Primär muskel</label>
                    <select id="muscle" name="muscle" class="form-select">
                        <option value="" th:selected="${muscle == null or muscle == ''}" th:text="#{general.all}">Alla</option>
                        <option th:each="mus : ${T(com.postlundhall.TraningsregisterSpringH2.model.Ovning$PrimarMuskel).values()}"
                                th:value="${mus.name()}" th:text="${#messages.msgOrNull('ovning.primarMuskel.' + mus)}"
                                th:selected="${muscle == mus.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1" th:text="#{general.filter}">Filtrera</button>
                    <a th:href="@{/ovningar}" class="btn btn-secondary" th:text="#{general.reset}">Återställ</a>
                </div>
                <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                <input type="hidden" name="sortDir" th:value="${sortDir}"/>
                <input type="hidden" name="size" th:value="${size}"/>
            </form>
        </div>

        <!-- Pagination Status -->
        <div th:if="${totalItems > 0}" class="mb-2 text-muted">
            <span th:text="'Visar ' + (${currentPage * size + 1}) + '–' + (${#lists.size(ovningar) + currentPage * size}) + ' av ' + ${totalItems} + ' övningar'"></span>
        </div>

        <div class="table-responsive">
            <table class="table table-striped" id="exerciseTable" aria-labelledby="exerciseTableCaption" lang="sv">
                <caption id="exerciseTableCaption" class="visually-hidden" th:text="#{ovning.list.caption}">Lista över övningar</caption>
                <thead>
                <tr>
                    <th scope="col">
                        <a th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy='ovningsnamn',sortDir=${sortBy == 'ovningsnamn' and sortDir == 'asc' ? 'desc' : 'asc'},page=${currentPage},size=${size})}"
                           th:text="#{ovning.form.name}">Namn</a>
                        <span th:if="${sortBy == 'ovningsnamn' and sortDir == 'asc'}"><i class="fas fa-sort-up" aria-hidden="true"></i></span>
                        <span th:if="${sortBy == 'ovningsnamn' and sortDir == 'desc'}"><i class="fas fa-sort-down" aria-hidden="true"></i></span>
                    </th>
                    <th scope="col">
                        <a th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy='utrustning',sortDir=${sortBy == 'utrustning' and sortDir == 'asc' ? 'desc' : 'asc'},page=${currentPage},size=${size})}"
                           th:text="#{ovning.form.equipment}">Utrustning</a>
                        <span th:if="${sortBy == 'utrustning' and sortDir == 'asc'}"><i class="fas fa-sort-up" aria-hidden="true"></i></span>
                        <span th:if="${sortBy == 'utrustning' and sortDir == 'desc'}"><i class="fas fa-sort-down" aria-hidden="true"></i></span>
                    </th>
                    <th scope="col">
                        <a th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy='primarMuskel',sortDir=${sortBy == 'primarMuskel' and sortDir == 'asc' ? 'desc' : 'asc'},page=${currentPage},size=${size})}"
                           th:text="#{ovning.form.muscle}">Primär muskel</a>
                        <span th:if="${sortBy == 'primarMuskel' and sortDir == 'asc'}"><i class="fas fa-sort-up" aria-hidden="true"></i></span>
                        <span th:if="${sortBy == 'primarMuskel' and sortDir == 'desc'}"><i class="fas fa-sort-down" aria-hidden="true"></i></span>
                    </th>
                    <th scope="col" th:text="#{ovning.view.actions}">Åtgärder</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ovning : ${ovningar}">
                    <td>
                        <a th:href="@{/ovningar/{id}(id=${ovning.id})}"
                           th:text="${ovning.ovningsnamn}"
                           class="text-decoration-none"
                           th:attr="aria-label=#{ovning.view.view} + ' ' + ${ovning.ovningsnamn},data-bs-toggle='tooltip',data-bs-title=${ovning.ovningsnamn}"></a>
                    </td>
                    <td th:text="${#messages.msgOrNull('ovning.utrustning.' + ovning.utrustning)}"></td>
                    <td th:text="${#messages.msgOrNull('ovning.primarMuskel.' + ovning.primarMuskel)}"></td>
                    <td>
                        <div class="d-flex gap-1" th:attr="aria-label=#{ovning.view.actions}">
                            <a th:href="@{/ovningar/{id}(id=${ovning.id})}"
                               class="btn btn-sm btn-info"
                               th:attr="aria-label=#{ovning.view.view},data-bs-toggle='tooltip',data-bs-title=#{ovning.view.view}">
                                <i class="fas fa-eye me-1" aria-hidden="true"></i>
                                <span class="visually-hidden" th:text="#{ovning.view.view}">Visa</span>
                            </a>
                            <a th:href="@{/ovningar/{id}/edit(id=${ovning.id})}"
                               class="btn btn-sm btn-warning"
                               th:attr="aria-label=#{ovning.view.edit},data-bs-toggle='tooltip',data-bs-title=#{ovning.view.edit}">
                                <i class="fas fa-pencil me-1" aria-hidden="true"></i>
                                <span class="visually-hidden" th:text="#{ovning.view.edit}">Redigera</span>
                            </a>
                            <form th:action="@{/ovningar/{id}/delete(id=${ovning.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        th:attr="aria-label=#{ovning.view.delete},data-bs-toggle='tooltip',data-bs-title=#{ovning.view.delete},data-name=${ovning.ovningsnamn}"
                                        onclick="return confirmDelete(this)">
                                    <i class="fas fa-trash-can me-1" aria-hidden="true"></i>
                                    <span class="visually-hidden" th:text="#{ovning.view.delete}">Ta bort</span>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-3">
            <nav aria-label="Sidnavigering">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy=${sortBy},sortDir=${sortDir},page=${currentPage - 1},size=${size})}"
                           th:unless="${currentPage == 0}" th:text="#{general.previous}">Föregående</a>
                        <span class="page-link" th:if="${currentPage == 0}" th:text="#{general.previous}">Föregående</span>
                    </li>
                    <li class="page-item" th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${p == currentPage ? 'active' : ''}" th:attr="aria-current=${p == currentPage ? 'page' : null}">
                        <a class="page-link" th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy=${sortBy},sortDir=${sortDir},page=${p},size=${size})}"
                           th:text="${p + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/ovningar(search=${search},equipment=${equipment},muscle=${muscle},sortBy=${sortBy},sortDir=${sortDir},page=${currentPage + 1},size=${size})}"
                           th:unless="${currentPage >= totalPages - 1}" th:text="#{general.next}">Nästa</a>
                        <span class="page-link" th:if="${currentPage >= totalPages - 1}" th:text="#{general.next}">Nästa</span>
                    </li>
                </ul>
            </nav>
        </div>

        <div th:if="${#lists.isEmpty(ovningar)}" class="alert alert-info" role="status" aria-live="polite">
            <span th:text="#{ovning.list.empty}">Inga övningar hittades.</span>
            <a th:href="@{/ovningar/new}" class="btn btn-primary btn-sm ms-2"
               th:text="#{ovning.form.title.new}">Ny övning</a>
        </div>

        <!-- JavaScript for tooltip initialization -->
        <script th:src="@{/js/tooltip-init.js}"></script>
    </section>
</main>
</html>
