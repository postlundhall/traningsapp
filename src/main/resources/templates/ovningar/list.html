<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Övningar</title></head>
<body>
<h1>Övningar</h1>
<a th:href="@{/}">Tillbaka</a> | <a th:href="@{/ovningar/new}">Lägg till ny</a>
<table border="1">
    <tr>
        <th>ID</th><th>Namn</th><th>Reps</th><th>Set</th><th>Åtgärder</th>
    </tr>
    <tr th:each="o : ${ovningar}">
        <td th:text="${o.id}"></td>
        <td th:text="${o.namn}"></td>
        <td th:text="${o.antalReps}"></td>
        <td th:text="${o.antalSet}"></td>
        <td>
            <a th:href="@{|/ovningar/${o.id}/edit|}">Redigera</a>
            <form th:action="@{|/ovningar/${o.id}/delete|}" method="post" style="display:inline">
                <button type="submit">Ta bort</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
