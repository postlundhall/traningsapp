<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv"
      th:fragment="base(mainContent)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{app.title}">TräningsApp</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <!-- FontAwesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous"/>

    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>

    <!-- Fallbacks for CDN failures -->
    <script src="/js/fallbacks.js" defer></script>
</head>
<body>
<header th:replace="~{layout/fragments/navbar :: navbar}"></header>
<main class="container my-4" th:replace="${mainContent}"></main>
<footer th:replace="~{layout/fragments/footer :: footer}"></footer>

<!-- Page-specific scripts -->
<script src="/js/character-counter.js"></script>
</body>
</html>
