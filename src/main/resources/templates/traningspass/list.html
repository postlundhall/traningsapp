<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::main})}">
<main>
    <div class="container">
        <h1 class="mb-4 display-5 fw-bold">Träningspass</h1>
        <div class="mb-3">
            <a th:href="@{/traningspass/new}" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Lägg till ny</a>
            <a th:href="@{/}" class="btn btn-secondary ms-2"><i class="fas fa-arrow-left me-1"></i> Tillbaka</a>
        </div>
        <div class="card">
            <div class="card-body">
                <div th:if="${traningspassList == null or traningspassList.isEmpty()}" class="alert alert-info">
                    Inga träningspass registrerade. <a th:href="@{/traningspass/new}" class="alert-link">Lägg till ett nytt träningspass</a>.
                </div>
                <table th:unless="${traningspassList == null or traningspassList.isEmpty()}" class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Namn</th>
                        <th>Syfte</th>
                        <th>Nivå</th>
                        <th>Längd (min)</th>
                        <th>Åtgärder</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="traningspass : ${traningspassList}">
                        <td th:text="${traningspass.passnamn}"></td>
                        <td th:text="#{traningspass.syfte.${traningspass.syfte}}"></td>
                        <td th:text="#{traningspass.niva.${traningspass.niva}}"></td>
                        <td th:text="${traningspass.langdMins}"></td>
                        <td>
                            <a th:href="@{|/traningspass/${traningspass.id}/edit|}" class="btn btn-sm btn-primary me-1" aria-label="Redigera träningspass"><i class="fas fa-edit"></i></a>
                            <form th:action="@{|/traningspass/${traningspass.id}/delete|}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger" aria-label="Radera träningspass" onclick="return confirm('Är du säker på att du vill radera detta träningspass?')"><i class="fas fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</html>
