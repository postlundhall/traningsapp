<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::main})}">
<main>
    <div class="container">
        <h1 class="mb-4 display-5 fw-bold">Övningar</h1>
        <div class="mb-3">
            <a th:href="@{/ovningar/new}" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Lägg till ny</a>
            <a th:href="@{/}" class="btn btn-secondary ms-2"><i class="fas fa-arrow-left me-1"></i> Tillbaka</a>
        </div>
        <div class="card">
            <div class="card-body">
                <div th:if="${ovningar == null or ovningar.isEmpty()}" class="alert alert-info">
                    Inga övningar registrerade. <a th:href="@{/ovningar/new}" class="alert-link">Lägg till en ny övning</a>.
                </div>
                <table th:unless="${ovningar == null or ovningar.isEmpty()}" class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Namn</th>
                        <th>Utrustning</th>
                        <th>Primär Muskel</th>
                        <th>Åtgärder</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ovning : ${ovningar}">
                        <td th:text="${ovning.ovningsnamn}"></td>
                        <td th:text="${ovning.utrustning}"></td>
                        <td th:text="${ovning.primarMuskel.name().replace('_', ' ').toLowerCase().capitalize()}"></td>
                        <td>
                            <a th:href="@{|/ovningar/${ovning.id}|}" class="btn btn-sm btn-info me-1" aria-label="Visa övning"><i class="fas fa-eye"></i></a>
                            <a th:href="@{|/ovningar/${ovning.id}/edit|}" class="btn btn-sm btn-primary me-1" aria-label="Redigera övning"><i class="fas fa-edit"></i></a>
                            <form th:action="@{|/ovningar/${ovning.id}/delete|}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger" aria-label="Radera övning" onclick="return confirm('Är du säker på att du vill radera denna övning?')"><i class="fas fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</html>
