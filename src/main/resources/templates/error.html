<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::main})}">
<main>
    <div class="container">
        <h1 class="mb-4 display-5 fw-bold" th:text="#{error.title}">Fel</h1>
        <div class="alert alert-danger" role="alert">
            <span th:text="${errorMessage} ?: #{error.unexpected}">Ett oväntat fel uppstod. Försök igen eller kontakta support.</span>
        </div>
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-secondary" role="button" th:attr="aria-label=#{error.back},data-bs-toggle='tooltip',data-bs-title=#{error.back}" th:text="#{error.back}">Tillbaka till startsidan</a>
        </div>
    </div>
</main>
</html>
