<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: base(~{::main})}">
<main>
    <div class="container">
        <h1 class="mb-4 display-5 fw-bold">Registrera</h1>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/templates/register}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Användarnamn</label>
                        <input type="text" class="form-control" id="username" name="username" required minlength="3" maxlength="50" aria-required="true"/>
                        <div class="form-text">Användarnamn måste vara mellan 3 och 50 tecken.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Lösenord</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" aria-required="true"/>
                        <div class="form-text">Lösenord måste vara minst 6 tecken.</div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a th:href="@{/templates/login}" class="btn btn-secondary me-2">Avbryt</a>
                        <button type="submit" class="btn btn-primary">Registrera</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</html>
