spring:
  application:
    name: TraningsregisterSpringH2
  datasource:
    url: jdbc:h2:file:./data/traningsappdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
  messages:
    basename: messages
    cache-duration: PT1H
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  main:
    allow-bean-definition-overriding: false
  web:
    locale: sv_SE
logging:
  level:
    org:
      springframework:
        web: DEBUG
        context.support.MessageSourceAccessor: DEBUG
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
